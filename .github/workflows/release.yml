name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build Single-File Executables
        shell: pwsh
        run: |
          .\publish.cmd

      - name: Upload Windows Light Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PrimeVideoSpeedApp-Light
          path: publish/Light/PrimeVideoSpeedApp.exe

      - name: Upload Windows Standalone Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PrimeVideoSpeedApp-Standalone
          path: publish/Standalone/PrimeVideoSpeedApp.exe

  build-android:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # A tagged build is a published build, so it must carry the stable release
      # key. Failing loudly here is deliberate: the Android Gradle Plugin would
      # otherwise silently fall back to a throwaway debug key, and the resulting
      # APK could never update the release before it.
      - name: Decode release keystore
        id: keystore
        env:
          PVSC_RELEASE_KEYSTORE_B64: ${{ secrets.PVSC_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$PVSC_RELEASE_KEYSTORE_B64" ]; then
            printf '%s' "$PVSC_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "::error::PVSC_RELEASE_KEYSTORE_B64 is not set. A tagged release must not be signed with a debug key."
            exit 1
          else
            echo "No release keystore configured; this untagged build will be debug-signed and must not be published."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          PVSC_RELEASE_KEYSTORE: ${{ steps.keystore.outputs.path }}
          PVSC_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PVSC_RELEASE_KEYSTORE_PASSWORD }}
          PVSC_RELEASE_KEY_ALIAS: ${{ secrets.PVSC_RELEASE_KEY_ALIAS }}
          PVSC_RELEASE_KEY_PASSWORD: ${{ secrets.PVSC_RELEASE_KEY_PASSWORD }}
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: PrimeVideoSpeedApp-Mobile
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Windows Light Artifact
        uses: actions/download-artifact@v8
        with:
          name: PrimeVideoSpeedApp-Light
          path: dist-tmp/Light

      - name: Download Windows Standalone Artifact
        uses: actions/download-artifact@v8
        with:
          name: PrimeVideoSpeedApp-Standalone
          path: dist-tmp/Standalone

      - name: Download Android Mobile Artifact
        uses: actions/download-artifact@v8
        with:
          name: PrimeVideoSpeedApp-Mobile
          path: dist-tmp/Mobile

      - name: Prepare Final Release Binaries
        run: |
          mkdir -p dist
          find dist-tmp/ -type f
          if [ -f dist-tmp/Light/PrimeVideoSpeedApp.exe ]; then
            cp dist-tmp/Light/PrimeVideoSpeedApp.exe dist/PrimeVideoSpeedApp-Light.exe
          else
            cp dist-tmp/Light/* dist/PrimeVideoSpeedApp-Light.exe
          fi

          if [ -f dist-tmp/Standalone/PrimeVideoSpeedApp.exe ]; then
            cp dist-tmp/Standalone/PrimeVideoSpeedApp.exe dist/PrimeVideoSpeedApp-Standalone.exe
          else
            cp dist-tmp/Standalone/* dist/PrimeVideoSpeedApp-Standalone.exe
          fi

          if [ -f dist-tmp/Mobile/app-release.apk ]; then
            cp dist-tmp/Mobile/app-release.apk dist/PrimeVideoSpeedApp-Mobile.apk
          else
            cp dist-tmp/Mobile/* dist/PrimeVideoSpeedApp-Mobile.apk
          fi
          ls -la dist/

      # Published so a download can be checked against the release page.
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
