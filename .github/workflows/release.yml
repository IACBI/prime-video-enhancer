name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Windows Executables
        shell: pwsh
        run: |
          .\publish.cmd

      - name: Build Android Mobile APK
        shell: pwsh
        run: |
          cd mobile
          flutter pub get
          flutter build apk --release

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "publish/Light/PrimeVideoSpeedApp.exe" "dist/PrimeVideoSpeedApp-Light.exe"
          Copy-Item "publish/Standalone/PrimeVideoSpeedApp.exe" "dist/PrimeVideoSpeedApp-Standalone.exe"
          if (Test-Path "mobile/build/app/outputs/flutter-apk/app-release.apk") {
            Copy-Item "mobile/build/app/outputs/flutter-apk/app-release.apk" "dist/PrimeVideoSpeedApp-Mobile.apk"
          }

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v7
        with:
          name: PrimeVideoSpeedApp-Binaries
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
