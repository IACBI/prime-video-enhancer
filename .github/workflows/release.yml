name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executables
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Single-File Executables
        shell: pwsh
        run: |
          .\publish.cmd

      - name: Upload Windows Light Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeVideoSpeedApp-Light
          path: publish/Light/PrimeVideoSpeedApp.exe

      - name: Upload Windows Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeVideoSpeedApp-Standalone
          path: publish/Standalone/PrimeVideoSpeedApp.exe

  build-android:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          cd mobile
          flutter create --org com.iacbi.primevideoenhancer .
          flutter pub get
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeVideoSpeedApp-Mobile
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Light Artifact
        uses: actions/download-artifact@v4
        with:
          name: PrimeVideoSpeedApp-Light
          path: dist-tmp/Light

      - name: Download Windows Standalone Artifact
        uses: actions/download-artifact@v4
        with:
          name: PrimeVideoSpeedApp-Standalone
          path: dist-tmp/Standalone

      - name: Download Android Mobile Artifact
        uses: actions/download-artifact@v4
        with:
          name: PrimeVideoSpeedApp-Mobile
          path: dist-tmp/Mobile

      - name: Prepare Final Release Binaries
        run: |
          mkdir -p dist
          find dist-tmp/ -type f
          if [ -f dist-tmp/Light/PrimeVideoSpeedApp.exe ]; then
            cp dist-tmp/Light/PrimeVideoSpeedApp.exe dist/PrimeVideoSpeedApp-Light.exe
          else
            cp dist-tmp/Light/* dist/PrimeVideoSpeedApp-Light.exe
          fi

          if [ -f dist-tmp/Standalone/PrimeVideoSpeedApp.exe ]; then
            cp dist-tmp/Standalone/PrimeVideoSpeedApp.exe dist/PrimeVideoSpeedApp-Standalone.exe
          else
            cp dist-tmp/Standalone/* dist/PrimeVideoSpeedApp-Standalone.exe
          fi

          if [ -f dist-tmp/Mobile/app-release.apk ]; then
            cp dist-tmp/Mobile/app-release.apk dist/PrimeVideoSpeedApp-Mobile.apk
          else
            cp dist-tmp/Mobile/* dist/PrimeVideoSpeedApp-Mobile.apk
          fi
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
